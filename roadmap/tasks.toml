[[task]]
id = 40
phase = 3
bundle = "math_validation"
status = "done"
title = "Port Aave V3 WadRayMath + MathUtils to Elixir"
scores = { d = 5, b = 8, u = 9 }
module = "Onchain.Aave.Math"
created_at = "2026-04-20"
body = """
Port Aave V3's rayMul, rayDiv, wadMul, wadDiv, calculateLinearInterest, calculateCompoundedInterest from Solidity (aave-v3-core/contracts/protocol/libraries/math/) to Elixir. Preserve Aave's rounding semantics (half-up at the ray/wad midpoint — not trivial). Prerequisite for Task 41; the current Math module holds only trivial div_pow10 scale conversions with nothing worth oracle-validating.
"""
implemented = "Integer-native port of WadRayMath + MathUtils; source pinned to aave-v3-origin@1e3d70c. See CHANGELOG.md#task-40-port-aave-v3-wadraymath--mathutils-to-elixir."
shipped_in = "f5f8599"

[[task]]
id = "40b"
phase = 3
bundle = "math_validation"
status = "superseded"
title = "Port missing WadRayMath ceil/floor variants on demand"
scores = { d = 3, b = 4, u = 3 }
module = "Onchain.Aave.Math"
depends_on = [40]
created_at = "2026-04-20"
body = """
rayMulFloor / rayMulCeil / rayDivFloor / rayDivCeil (from WadRayMath.sol) and mulDivCeil (from MathUtils.sol) exist in the pinned aave-v3-origin@1e3d70c source but aren't used by any Task 40 entrypoint, so Task 41's revm harness won't surface them as a gap. They ARE used by TokenMath.sol, ReserveLogic.sol, GenericLogic.sol, LiquidationLogic.sol. Gated until a caller from Pool/TokenMath call paths in this repo needs them; port minimally on demand with matching round-half-up semantics and revm cross-validation.
"""

[[task]]
id = 41
phase = 3
bundle = "math_validation"
status = "done"
title = "Cross-validate Aave.Math via revm against on-chain Aave V3"
scores = { d = 4, b = 7, u = 6 }
module = "test/onchain/aave/math_revm_test.exs"
depends_on = [40]
created_at = "2026-04-20"
body = """
Repeat-with-revm cross-validation harness. Vendor a Solidity wrapper inlining Aave V3's 8 Layer-2 math function bodies verbatim from aave-v3-origin@1e3d70c; compile once with solc 0.8.10; inject runtime bytecode at a fake address via Onchain.EVM.simulate_call/3's state_overrides["code"]. For each function: deterministic vectors (zero, identity, midpoint rounding) plus StreamData random runs, assert bit-exact equality against Onchain.Aave.Math.
"""
implemented = "revm cross-validation harness with zero-tolerance equality across deterministic + StreamData property vectors for all 8 Layer-2 functions; SHA256-pinned compiled wrapper bytecode verified at setup_all. See CHANGELOG.md#task-41-revm-cross-validation-of-aavemath."
shipped_in = "afad187"

[[task]]
