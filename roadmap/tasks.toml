schema_version = 2
project = "onchain_js"
default_branch = "main"
vision = "Run battle-tested npm packages on the BEAM via QuickBEAM — no Node.js required."

[focus]
phase = 1

[phases.1]
name = "Foundation"
order = 1
status = "in_progress"

[phases.2]
name = "Ethereum JS Tools"
order = 2
status = "pending"

[phases.3]
name = "Cross-Validation & Utilities"
order = 3
status = "pending"

[milestones.v0_3]
name = "First real npm library end-to-end"
order = 1
status = "active"
target_version = "0.3.0"
description = "Proves an npm Ethereum library can be installed, loaded and driven from Elixir through QuickBEAM with no Node.js on the host — solc-js is the first consumer that has to work for real."

[milestones.v0_4]
name = "The JS library shelf"
order = 2
status = "pending"
target_version = "0.4.0"
description = "Proves the bridge generalizes past one library — that unmodified DeFi SDKs (Uniswap, DeFiSaver, 1inch) and utility libraries (aave math-utils, merkletreejs) run on the BEAM through the same loading contract solc-js proved out."

[bundles.foundation]
