module = "Onchain.EVM"
scores = { d = 1, b = 3, u = 4 }
body = """
Batch partial-failure docs. Per-call reverts inside `simulate_batch` surface as `%{success: false, output: "0x"}` inside the outer `{:ok, results}`. That's the right design (batch resilience) but isn't called out in `@moduledoc`; a consumer seeing `{:ok, _}` may assume every call succeeded. Document explicitly that outer `{:ok, _}` only signals the fork itself succeeded — per-call outcomes must be checked against `:success`. Discovered 2026-04-22.
"""

# Bundle 5: EVM Input Validation Round 2

[[task]]
id = 45
phase = 2
bundle = "bundle5_evm_input_validation_round2"
title = "`simulate_batch/2` input shape validation — reject non-list `calls` and non-2-tuple elements before `validate_calls/1`"
status = "pending"
module = "Onchain.EVM"
scores = { d = 2, b = 6, u = 5 }
body = """
Batch input shape. `simulate_batch(%{}, opts)` currently returns `{:ok, []}` silently because `Enum.reduce_while/3` iterates any `Enumerable`; `simulate_batch([{addr, data, :extra}], opts)` raises `FunctionClauseError` from the anon fn inside `validate_calls/1`, escaping the `{:ok, _} | {:error, _}` contract. Add a pre-guard requiring `is_list(calls)` and pattern-match 2-tuples explicitly, returning `{:error, {:invalid_calls, _}}` in both cases. Discovered 2026-04-22 during onchain_aave Task 41 (first real consumer integration).
"""

[[task]]
id = 46
phase = 2
bundle = "bundle5_evm_input_validation_round2"
title = "Validate `:value` option as 0x-prefixed even-length hex U256, not any binary"
status = "pending"
module = "Onchain.EVM"
scores = { d = 2, b = 5, u = 4 }
body = """
Value hex validation. `maybe_put_value/2` currently only checks `is_binary/1`. `value: ""` and `value: "not-a-hex"` pass Elixir, fail in Rust as `{:evm_error, "invalid U256 hex: digit ... is out of range"}`. Validate 0x-prefixed, even-length, hex-only at the Elixir boundary → `{:error, {:invalid_value, _}}`. Discovered 2026-04-22 during onchain_aave Task 41.
"""

[[task]]
id = 47
phase = 2
bundle = "bundle5_evm_input_validation_round2"
title = "Validate `:state_overrides` nested keys/values are strings, per `@type state_overrides`"
status = "pending"
module = "Onchain.EVM"
scores = { d = 2, b = 5, u = 4 }
body = """
state_overrides nested validation. `@type state_overrides` doc is explicit that all keys/values in nested maps must be strings. Currently atom keys (`%{addr => %{code: "0x..."}}`) and int values (`%{"balance" => 123}`) produce `{:evm_error, "invalid state_overrides format"}` from Rust. Validate recursively in `maybe_put_state_overrides/2`. Discovered 2026-04-22 during onchain_aave Task 41.
"""

[[task]]
id = 48
phase = 2
bundle = "bundle5_evm_input_validation_round2"
title = "Bound-check `:block` hex values against u64 max in `parse_hex_block/2`"
status = "pending"
module = "Onchain.EVM"
scores = { d = 2, b = 4, u = 3 }
body = """
Block u64 bound. `parse_hex_block/2` calls `Integer.parse/2` with no upper bound; `block: "0x" <> String.duplicate("f", 20)` lands as `{:evm_error, "invalid param type: block_number"}` from the NIF. Reject > u64 max at the Elixir layer → `{:error, {:invalid_block, _}}`. Discovered 2026-04-22 during onchain_aave Task 41.
"""

