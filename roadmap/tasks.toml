touches = ["native/onchain_solidity/src/lib.rs"]
assignee = "codex"
module = "native/onchain_solidity"
model = "gpt-5.6-sol"
body = """
The onchain_solidity crate has almost no cargo-level tests (two, both added by the Task 61 parser migration to characterize accepted syntax). It is also the crate whose output is consumed at compile time by `Onchain.Contract.Generator`, so a wrong selector or a mis-canonicalized type does not fail loudly — it generates a module that encodes calls nobody on-chain will answer.

