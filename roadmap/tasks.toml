schema_version = 2
project = "onchain_evm"
default_branch = "main"
vision = "EVM simulation, Solidity parsing, debug/trace APIs, and contract codegen for Elixir via Rust NIFs."

[focus]
phase = 2

[phases.1]
name = "Foundation"
order = 1
status = "done"

[phases.2]
name = "Quality & Reliability Improvements"
order = 2
status = "in_progress"

[phases.3]
name = "Standalone & Release"
order = 3
status = "in_progress"

[bundles.contract_codegen]
phase = 1
order = 1
description = "Contract Codegen — drop a .sol file, get a typed Elixir module. Rustler NIF using Alloy to parse Solidity at compile time, Elixir macros to generate typed wrappers."

[bundles.local_evm_simulation]
phase = 1
order = 2
description = "Local EVM Simulation — simulate contract execution locally without hitting the chain. Reuses the Rustler NIF infrastructure from codegen."

[bundles.bundle1_evm_input_validation]
phase = 2
order = 1
description = "Bundle 1: EVM Input Validation — string block tags, rpc_url validation, strict option validation."

[bundles.bundle2_rust_safety_hardening]
phase = 2
order = 2
description = "Bundle 2: Rust Safety Hardening — error handling, input size limits, NIF error taxonomy. Hex-release blocker."

[bundles.bundle3_elixir_code_quality]
phase = 2
order = 3
description = "Bundle 3: Elixir Code Quality — eliminate duplication, typed error unions, dead-code removal."

[bundles.bundle4_documentation_specs]
phase = 2
order = 4
description = "Bundle 4: Documentation & Specs — typespecs, generator option docs, Rust module docs, batch partial-failure semantics."

[bundles.bundle5_evm_input_validation_round2]
phase = 2
order = 5
description = "Bundle 5: EVM Input Validation Round 2 — discovered 2026-04-22 during onchain_aave Task 41 (first real consumer integration). Scoped as one class invariant (Task 57) after four point-fix tasks were merged: the 'NIF catches what Elixir should' pattern — validation that happens after the NIF boundary with bare-string reasons, when it should happen at the Elixir layer with tagged error atoms."

[bundles.standalone]
phase = 3
order = 1
description = "Standalone Tasks — Rust unit tests, runtime reuse, clippy CI, codegen extensions, hex-release prep."

