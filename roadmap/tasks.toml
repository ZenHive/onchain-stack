schema_version = 2
project = "onchain_aave"
default_branch = "main"
vision = "Protocol-correct Aave V3 and V4 wrappers for Elixir — read positions, execute actions, and verify behavior against deployed contracts. Built on the onchain core library as part of the seven-repository onchain family."

[focus]
phase = 5

[milestones.v0_5]
name = "Live-evidenced V3/V4 surface"
order = 1
status = "active"
target_version = "0.5.0"
description = "Tests whether onchain_aave can express core V3 position-management and V4 Hub-and-Spoke flows with reproducible evidence against deployed Aave contracts."

# ----------------------------------------------------------------------------
# Phases
# ----------------------------------------------------------------------------

[phases.1]
name = "Aave Core (Read)"
order = 1
status = "done"

[phases.2]
name = "Aave Actions (Write)"
order = 2
status = "done"

[phases.3]
name = "Math Validation"
order = 3
status = "done"

[phases.4]
name = "Cleanup Backlog"
order = 4
status = "done"

[phases.5]
name = "Aave V4 Support"
order = 5
status = "in_progress"

[phases.6]
name = "V3 Write Surface Gaps"
order = 6
status = "pending"

[phases.7]
name = "Read-Path Multicall Adoption"
order = 7
status = "done"

[phases.8]
name = "Event & Revert Decoding"
order = 8
status = "pending"

# ----------------------------------------------------------------------------
# Bundles
# ----------------------------------------------------------------------------

[bundles.core_read]
phase = 1
order = 1
description = "Aave V3 read surface: contract registry, math conversions, pool/oracle/ui-data reads, response type structs, multi-chain addresses."

[bundles.actions_write]
phase = 2
order = 1
description = "Aave V3 write surface: pool supply/borrow/repay/withdraw and the testnet faucet."

[bundles.math_validation]
phase = 3
order = 1
description = "Cross-validate Aave.Math against Solidity (revm via onchain_evm) and Aave frontend math (@aave/math-utils via onchain_js)."

[bundles.cleanup]
phase = 4
order = 1
description = "v0.1.0 staged-review polish: shared helpers, named address attributes, test-helper consolidation, centralized dialyzer suppressions."

[bundles.v4_support]
phase = 5
order = 1
description = "Aave V4 Hub-and-Spoke support: address registry, read-surface selection, Hub/Spoke/Oracle/TokenizationSpoke reads, PositionManager writes, integration tests."

[bundles.v3_write_gaps]
phase = 6
order = 1
description = "Close observed V3 position-management and reserve-read gaps, while removing protocol capabilities that deployed Aave no longer supports."

[bundles.multicall]
phase = 7
order = 1
description = "Adopt Onchain.Multicall in Aave batch read paths where the protocol does not pre-batch."

[bundles.event_error_decoding]
phase = 8
order = 1
description = "Decode what the deployed protocol says back: Pool event logs with topic filters, structured revert reasons on write failures, and strict ABI decoding of responses."

