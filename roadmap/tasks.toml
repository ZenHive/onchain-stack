Block u64 bound. `parse_hex_block/2` calls `Integer.parse/2` with no upper bound; `block: "0x" <> String.duplicate("f", 20)` lands as `{:evm_error, "invalid param type: block_number"}` from the NIF. Reject > u64 max at the Elixir layer → `{:error, {:invalid_block, _}}`. Discovered 2026-04-22 during onchain_aave Task 41.
