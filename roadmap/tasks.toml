module = "Onchain.EVM"
scores = { d = 2, b = 5, u = 4 }
body = """
Value hex validation. `maybe_put_value/2` currently only checks `is_binary/1`. `value: ""` and `value: "not-a-hex"` pass Elixir, fail in Rust as `{:evm_error, "invalid U256 hex: digit ... is out of range"}`. Validate 0x-prefixed, even-length, hex-only at the Elixir boundary → `{:error, {:invalid_value, _}}`. Discovered 2026-04-22 during onchain_aave Task 41.
"""

