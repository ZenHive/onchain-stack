body = """
Batch partial-failure docs. Per-call reverts inside `simulate_batch` surface as `%{success: false, output: "0x"}` inside the outer `{:ok, results}`. That's the right design (batch resilience) but isn't called out in `@moduledoc`; a consumer seeing `{:ok, _}` may assume every call succeeded. Document explicitly that outer `{:ok, _}` only signals the fork itself succeeded — per-call outcomes must be checked against `:success`. Discovered 2026-04-22.
"""

# Bundle 5: EVM Input Validation Round 2

[[task]]
id = 45
phase = 2
bundle = "bundle5_evm_input_validation_round2"
title = "`simulate_batch/2` input shape validation — reject non-list `calls` and non-2-tuple elements before `validate_calls/1`"
status = "superseded"
module = "Onchain.EVM"
scores = { d = 2, b = 6, u = 5 }
body = """
Batch input shape. `simulate_batch(%{}, opts)` currently returns `{:ok, []}` silently because `Enum.reduce_while/3` iterates any `Enumerable`; `simulate_batch([{addr, data, :extra}], opts)` raises `FunctionClauseError` from the anon fn inside `validate_calls/1`, escaping the `{:ok, _} | {:error, _}` contract. Add a pre-guard requiring `is_list(calls)` and pattern-match 2-tuples explicitly, returning `{:error, {:invalid_calls, _}}` in both cases. Discovered 2026-04-22 during onchain_aave Task 41 (first real consumer integration).
"""

