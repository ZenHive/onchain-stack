[package]
name = "onchain_solidity"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[lib]
name = "onchain_solidity"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
alloy-json-abi = "1.6"
serde_json = "1"
hex = "0.4"
solar-parse = "0.2.0"
tiny-keccak = { version = "2", features = ["keccak"] }

[lints.clippy]
# Production has zero unwrap() and nine infallible expect()s (Task 31).
# Denying expect_used would only add allows; unwrap_used catches the next
# fallible one. Test code is exempted at the crate root via cfg(test).
unwrap_used = "deny"
