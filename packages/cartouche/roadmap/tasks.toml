[[task]]
id = "126"
phase = 0
bundle = "rpc_correctness"
status = "done"
title = "Spec-path fill_transaction V1 results drop chainId, so encode is pre-EIP-155"
scores = { d = 4, b = 5, u = 4 }
acceptance_criteria = ["A spec-conforming unsigned legacy FillTransactionResult that includes chainId deserializes so the chain id is not discarded", "Encoding that filled V1 produces the EIP-155 unsigned payload [chainId, 0, 0], not the pre-EIP-155 [0, 0, 0]", "A spec-conforming unsigned legacy result that omits chainId still deserializes; encode of that struct remains the pre-EIP-155 unsigned payload", "V1.get_signature/1 still reports missing signature on both shapes", "V2/V_2930/V3/V4 spec-path fills continue to keep chain_id from from_json/1; from_json/1 on signed V1–V4 still raises InvalidHex on a corrupt present signature", "A unit test covers both the chainId-present and chainId-absent legacy fill shapes", "mix ci passes"]
out_of_scope = ["Changing eth_getBlockBy* decode of signed legacy transactions", "Adding a public unsigned-transaction type beyond what this preservation requires", "Making anvil implement eth_fillTransaction"]
touches = ["lib/cartouche/rpc.ex", "lib/cartouche/transaction.ex", "test/rpc_test.exs"]
assignee = "grok"
model = "grok-4.6"
body = """
Open decision before dispatch: how should an unsigned legacy fill carry chain id? Two coherent answers, pick one and write it into the implementation — do not leave both.

1. Keep v/r/s as nil (the Task 125 unsigned representation) and also preserve chainId, then teach V1.encode/1 to emit [chainId, 0, 0] when the signature is absent.
2. When chainId is present, restore the V1.new/7 convention of v=chain_id, r=0, s=0 so the existing encode path already emits EIP-155 unsigned RLP. When chainId is absent, keep nil → encode as 0.

A spec-path `eth_fillTransaction` result is a `FillTransactionResult` whose `tx` is a `FilledTransaction` (`ethereum/execution-apis` `src/schemas/transaction.yaml`). For legacy that is `TransactionLegacyUnsigned`: no `v`/`r`/`s`, and `chainId` is an optional property (not in `required`). Task 125 deserializes that shape by injecting throwaway signature placeholders, running `from_json/1`, then clearing v/r/s to nil.

The drop: `V1.from_json/1` never reads `chainId` (legacy signed JSON carries replay protection in `v`, not a separate field), and `clear_transaction_signature/1` then sets `v: nil`. `V1.encode/1` treats nil as 0, so a filled legacy struct encodes as the pre-EIP-155 payload `[0, 0, 0]` rather than `[chainId, 0, 0]`. Typed envelopes already keep `chain_id` because their `from_json/1` reads it. Surfaced as a residual concern on the Task 125 review, not a rejection.

Authority is `ethereum/execution-apis` (`TransactionLegacyUnsigned.chainId`) plus EIP-155. The current unit fixture `unsigned_filled_v1_json/0` omits `chainId`, so it cannot catch this.
"""
implemented = 'lib/cartouche/rpc.ex,lib/cartouche/transaction.ex,test/rpc_test.exs — acceptance criterion 3 ("a legacy result that omits chainId still deserializes; encode remains the pre-EIP-155 unsigned payload") was deliberately OVERRULED, not met: [0, 0, 0] is not a valid pre-EIP-155 payload either (that is a six-field body), so a legacy fill with no chain id from either the response or the chain_id: option is refused instead of encoded. Criterion 4 ("get_signature/1 still reports missing signature on both shapes") now applies to the one surviving shape. Rationale recorded in .audit/a98c5c0.md and .audit/17b7f2a-rpc-decode-eth-filltrans.md.'
