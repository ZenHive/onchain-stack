[[task]]
id = "104"
phase = 0
bundle = "signer_backends"
status = "done"
title = "Formalize signer backends as a behaviour (pure digest-signer contract) — unlock multi-provider signing"
scores = { d = 4, b = 6, u = 6 }
acceptance_criteria = ["A `Cartouche.Signer.Backend` behaviour exists with documented `@callback get_address/...` and `@callback sign/...`; the existing implicit MFA contract is now compile-checked.", "`Cartouche.Signer.Curvy` and `Cartouche.Signer.CloudKMS` declare `@behaviour Cartouche.Signer.Backend` + `@impl true`, compile clean (warnings-as-errors), all existing doctests/tests green.", "The sign contract is a PURE DIGEST/PAYLOAD signer: the backend signs exactly the bytes it is handed (secp256k1 backends expect the 32-byte digest; ed25519 backends expect the raw message). Message hashing moves OUT of the backend into the caller (`Cartouche.Signer` / a helper), so plain Eth-tx signing, EIP-712 typed-data, and Solana all reuse one backend set with no per-venue backend change. `find_recid` is fed the same digest the backend signed.", "Both signer modules are at critical-tier >=95% coverage BEFORE mutating (raise first if below); full suite green; dialyzer run LOCALLY (per CLAUDE.md KMS-dialyzer-stays-local rule) shows no new warnings on touched files.", "Config decision is recorded and proven by a test: either (a) keep `:priv_key`/`:cloud_kms` shorthands AND accept an explicit `{BackendModule, config}` form (non-breaking), or (b) clean break to module-form-only. A test asserts the chosen config path still starts a working signer end-to-end.", "CHANGELOG + `implemented` field document the contract and the config decision."]
out_of_scope = ["New backend implementations (AWS KMS secp256k1, Azure Key Vault P-256K/ES256K, HashiCorp Vault Transit ed25519 + Kaleido ethsign plugin for secp256k1, MPC/custody Turnkey/Fireblocks/Dfns) — each is a separate follow-up task once the behaviour lands.", "EIP-712 / Hyperliquid 'phantom agent' and other Axis-B venue message builders — orthogonal (a message builder on top of `Cartouche.Typed`, not a signer backend); separate task.", "Req/Goth-based dep-light rewrite of the GCP CloudKMS backend (dropping google_api_cloud_kms + google_gax) — separate task; the behaviour just makes it a drop-in second impl later.", "Solana signer-family refactor is IN scope only if the Eth/Solana parallel structures would otherwise diverge; splitting Solana onto the behaviour can be a fast-follow if it balloons this task."]
assignee = "human"
body = """
Investigation thread (this session): the existing MFA dispatch in Cartouche.Application (`signer_mfa/1` / `solana_signer_mfa/1`) + `Cartouche.Signer`'s `apply(mod, :get_address, args)` / `apply(mod, :sign, [message | args])` is ALREADY a de-facto signer API — every backend exposes `get_address` + `sign`, called blindly. This task formalizes that implicit contract into a real `@behaviour` (compile-time `@impl` checks, docs, discoverability) and makes adding backends not require a new clause in the per-type dispatch.

TWO ORTHOGONAL AXES surfaced and must stay separated:
- Axis A (THIS task) — key custody / signer backend: WHERE the key lives, WHO computes the secp256k1/ed25519 signature. Local Curvy, GCP/AWS/Azure KMS, Vault, MPC all collapse to the same two callbacks. The only variance is auth, request shape, signature encoding (DER vs raw), and prehash-vs-raw.
- Axis B (separate tasks) — signing TARGET / message format: Ethereum tx, EIP-712 typed data, Hyperliquid phantom-agent action hash, Solana tx. These are message builders on top of Cartouche.Typed (lib/cartouche/typed.ex, already present), NOT signer backends.

THE ONE DESIGN DECISION THAT MATTERS (the payoff): make the backend a pure digest/payload signer. Today CloudKMS/Curvy keccak the message INTERNALLY — wrong for EIP-712/Hyperliquid where the caller already computed the typed-data hash. If the behaviour signs exactly the bytes handed to it (secp256k1 -> 32-byte digest; ed25519 -> raw message) and the caller owns hashing, then ONE backend set covers plain Eth tx + EIP-712 + Hyperliquid + Solana with zero per-venue backend touches. Bake hashing into the backend and every new venue forces a backend change.

CURVE-SUPPORT CONSTRAINT (verified this session via web research; sources in transcript): only GCP Cloud KMS signs BOTH curves natively (secp256k1 EC_SIGN_SECP256K1_SHA256 + ed25519 EC_SIGN_ED25519, Apr 2024). AWS KMS and Azure Key Vault do secp256k1 but NOT ed25519. HashiCorp Vault Transit does ed25519 natively but NOT secp256k1 (needs Kaleido vault-plugin-secrets-ethsign). MPC/custody (Turnkey/Fireblocks/Dfns/Fordefi) cover both but are higher-level/async. Implication: a multi-provider story is NOT 'swap Google for X' — it's pick-a-provider-per-curve. The behaviour must NOT assume one backend covers both chains.

IMPLEMENTATION GOTCHA to bake into the contract from the start (so backend tasks inherit it): AWS/Azure return DER-encoded ECDSA needing low-s canonicalization (EIP-2 malleability — the classic 'dark side of the elliptic curve' bug). The contract / a shared helper should normalize to low-s so each new secp256k1 backend does not re-solve it.

OPEN FORKS for the design phase (do not pre-decide here): (1) config back-compat — keep :priv_key/:cloud_kms shorthands + add module form, vs clean break to module-form-only; (2) Eth-only vs Eth+Solana scope; (3) which provider proves the extension point first — recommended AWS KMS (largest install base, smallest delta from GCP shape, forces DER/low-s handling into the contract early).

Touch points: lib/cartouche/signer.ex (sign_direct hashing, GenServer handle_call), lib/cartouche/signer/{curvy,cloud_kms}.ex, lib/cartouche/application.ex (signer_mfa dispatch / config parsing), and the Solana parallels if in scope. CloudKMS work => dialyzer verification stays LOCAL (cartouche PLT OOMs on cloud VMs — see CLAUDE.md). Critical-tier (signing) => >=95% coverage gate before mutating.
"""
implemented = "Shipped in 7c82cd8 (CHANGELOG 'Cartouche.Signer.Backend behaviour'). Three callbacks — algorithm/1, public_key/1, sign_payload/2 — NOT the get_address/sign names this task's acceptance criteria guessed at scoping time; the shipped names are the better ones and the criteria were never re-worded. Pure digest/payload contract: sign_payload/2 signs exactly the bytes handed to it, hashing moved into the caller (Cartouche.Signer), so one backend set serves Eth tx, EIP-712, Hyperliquid and Solana. Cartouche.Signer.{Curvy,CloudKMS} and Cartouche.Solana.Signer.{Ed25519,CloudKMS} all declare @behaviour + @impl. Address derivation, low-s canonicalization (new Recover.normalize_low_s/1) and recid recovery live caller-side so future secp256k1 backends inherit them. Config decision (a) non-breaking: :priv_key/:cloud_kms/:ed25519 shorthands kept, explicit {BackendModule, config} form additionally accepted (application.ex:57-97), proven end-to-end by test/signer_test.exs:39 '{backend, config} carrier (pure-payload path)'. Signer/recover modules at 100% coverage bar the unreachable find_recid guard. Three latent defects the audit recorded and deferred (32-byte payload guard, CloudKMS DER parse-wrap, unconsumed algorithm/1 curve guard) are carried forward as a separate task, not silently dropped."
delivered_by = "human"
verified = true
verified_by = "audit-review v1 dual-reviewer (claude-opus-4-8 + codex)"
