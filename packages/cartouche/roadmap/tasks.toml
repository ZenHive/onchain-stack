scores = { d = 5, b = 6, u = 5 }
acceptance_criteria = ["`defrpc` macro defined with a @moduledoc/@doc explaining the declaration shape", "Each generated wrapper emits an equivalent @spec, @doc, and Descripex api() block — Cartouche.describe output for converted methods is unchanged", "The uniform subset in Cartouche.RPC and Cartouche.Solana.RPC is converted; compiled behavior is byte-identical (existing doctests + tests pass unchanged)", "Irregular wrappers (guards, struct dispatch, multi-clause) are left hand-written and listed in the PR description", "Both RPC modules stay at >=95% line coverage"]
