[[task]]
id = "117"
phase = 0
bundle = "phase9_tx"
status = "done"
title = "Encode must not emit wire-non-conformant RLP — close the encode/decode conformance gap across V2/V3/V4"
scores = { d = 3, b = 8, u = 7 }
markers = ["security"]
depends_on = [115]
acceptance_criteria = ["The invariant is stated once and enforced for every encodable envelope: anything `encode/1` accepts must produce RLP that this library's own `decode/1` reads back to an equal struct, and that matches the EIP's wire shape. Verify the shape against the EIP text (EIP-2930 access-list item is `[address, storage_keys]`; EIP-7702 forbids an empty `authorization_list`; EIP-4844 requires a non-empty `blob_versioned_hashes` whose entries begin with VERSIONED_HASH_VERSION_KZG 0x01), not against the existing encoders", "V2's bare-address access-list shorthand no longer produces a raw 20-byte RLP item: `normalize_access_list/1` (lib/cartouche/transaction.ex:843) either rejects a bare address or lifts it to `[address, []]`. Whichever is chosen, the choice is recorded in the CHANGELOG as a behaviour change and `V2.t()`'s declared `access_list` type (transaction.ex:473) and the private spec agree with the runtime", "The seven doctests that currently pin the non-conformant bytes are corrected, not deleted: transaction.ex:735-738, :745-748, and the `build_trx_v2`/`build_signed_trx_v2` examples at :1718 and :1736. Each corrected expected value is justified by hand-decoding the RLP, and the corrected V2 hex round-trips through `V2.decode/1`", "A round-trip test per envelope asserts `decode(encode(tx)) == {:ok, tx}` over the previously-broken inputs: a V2 access list containing a bare address, a V4 with `authorization_list: []`, a V3 with an empty `blob_versioned_hashes` and a V3 whose blob hash lacks the 0x01 prefix. Each currently fails; each must pass or be rejected at encode with a named error", "Encode-side validation and decode-side validation are symmetric: no envelope rejects on decode a value it silently accepted on encode. Verified by enumerating the decode-side guards (v3.ex:398-407, v4.ex:533) and pointing at the matching encode-side guard", "Touched modules stay at >=95% coverage (transaction encoding is critical tier) and `mix ci` passes"]
out_of_scope = ["V_2930's write surface — that is task 115, which this depends on; if 115 has landed, its encoder must satisfy the same invariant and is in scope only for that check", "The property-test and golden-vector suite — task 113 consumes this invariant, it does not establish it", "Any change to the RLP codec itself or to `Cartouche.Hex`", "Solana transaction paths"]
touches = ["lib/cartouche/transaction.ex", "lib/cartouche/transaction/v3.ex", "lib/cartouche/transaction/v4.ex", "test/transaction_test.exs"]
assignee = "codex"
model = "gpt-5.6-sol"
body = """
`Cartouche.Transaction.V2.encode/1` can emit an access list that no conformant Ethereum node will accept, and the library's own decoder cannot read back.

Verified by reading the code, not inferred. `normalize_access_list/1` (lib/cartouche/transaction.ex:843-849) carries a `bare_address when is_binary(bare_address) -> bare_address` clause that passes a raw 20-byte address straight through as an RLP string item, where EIP-2930 requires each access-list entry to be a two-element `[address, storage_keys]` list. `V2.decode_access_list/1` (:1021-1035) pattern-matches only `[address, storage]`, so the bare-address entry raises FunctionClauseError into the rescue clause and decode returns `{:error, "invalid v2 transaction"}`. `V2.t()` declares `access_list: [{<<_::160>>, [<<_::256>>]}]` (:473) — tuples only — so the struct type, the encoder and the decoder disagree three ways. V3 (v3.ex:337-340) and V4 (v4.ex:371-374) accept only the tuple form, so this is V2-specific drift.

The shorthand is not an accident that nobody exercises: five module doctests pin its output as correct (transaction.ex:735-738, :745-748) and the `build_trx_v2` / `build_signed_trx_v2` convenience-builder doctests (:1718, :1736) use it too. Hand-decoding the pinned hex at :738 confirms the defect — `...EA 94<20 bytes> 94<20 bytes>` is a list of two 20-byte strings, not a list of two sublists. So the documented happy path of the library builds transactions with a malformed access list.

Scope this as the class invariant, not as the one patch. The same encode-permits / decode-rejects asymmetry appears twice more on the same surface, and fixing only V2 leaves the next instance free to spawn a sibling task:
- V4 `authorization_list: []` — EIP-7702 declares such a transaction invalid; `decode_authorization_list/1` (v4.ex:533) rejects it, but `V4.new/10` and `encode_authorization_list/1` (v4.ex:377) accept it silently.
- V3 `blob_versioned_hashes` — EIP-4844 requires a non-empty list whose entries carry the 0x01 KZG version prefix; decode enforces the prefix (v3.ex:398-407) but the `Enum.all?` is vacuously true on `[]`, and encode (v3.ex:337-340) checks neither.

Authority is the EIP text, per this repo's standing rule: verify the wire shape against EIP-2930 / EIP-4844 / EIP-7702 directly, never against the current encoders, so a copied-forward error cannot be ratified.

Dispatch trigger: this is transaction-encoding code on the money path and the fix changes a documented public input shape.

Discovered 2026-08-22 by an orchestrator conformance sweep that read every envelope's RLP field order against the fetched EIP texts. That sweep found the base field orders of V1/V2/V3/V4 correct and the EIP-155 v-formula computed rather than hard-coded — the access-list and list-emptiness asymmetries above are the only conformance defects it surfaced.
"""
implemented = "Landed by codex via merge-train; reviewer-approved (run run-1787384096316-ad114146, 710868e80fcdb0dc560febd4bedfd35e30a170ff)."
