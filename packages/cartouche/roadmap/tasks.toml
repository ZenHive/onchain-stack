status = "done"

[phases.6]
name = "Cartouche.VM.Context.init_from/2 spec"
order = 6
status = "done"

[phases.7]
name = "Dependency freshness"
order = 7
status = "done"

[phases.8]
name = "Cartouche.Transaction.V2.encode/1 duplication"
order = 8
status = "done"

[phases.9]
