schema_version = 2
project = "hieroglyph"
default_branch = "main"
vision = "Production-grade Solidity ABI encoder/decoder for Elixir, matching feature parity with eth-abi (Python), ethers/viem (JS), and alloy (Rust)."

[focus]
phase = 5

# ---------------------------------------------------------------------------
# Phases
# ---------------------------------------------------------------------------

[phases.1]
name = "Upstream & Fork Bug Fixes"
order = 1
status = "done"

[phases.2]
name = "Agent Economy (Descripex)"
order = 2
status = "done"

[phases.3]
name = "Public Surface & Quality Debt"
order = 3
status = "done"

[phases.4]
name = "DeFi Fixtures & Property Suite"
order = 4
status = "done"

[phases.5]
name = "Peer-Library Parity"
order = 5
status = "in_progress"

# ---------------------------------------------------------------------------
# Bundles
# ---------------------------------------------------------------------------

[bundles.bugs]
phase = 1
order = 1
description = "Correctness fixes carried over the exthereum/abi fork — indexed-event decoding, type rejection, lexer shadowing, overflow guards, NUL truncation."

[bundles.agent_economy]
phase = 2
order = 1
description = "Descripex annotation of the public surface so it is discoverable via __api__/0, ABI.describe/0..2, and a static api_manifest.json. Contract-stability artifact for the cartouche/onchain downstream chain."

[bundles.public_surface]
phase = 3
order = 1
description = "1.2.0 Public Surface Pass — decode_event/4 error contract narrowed, encode_bytes/1 → defp, new decode_error/2 and encode_packed/2."

[bundles.tests_recent]
phase = 3
order = 2
description = "Tests for recently-added features — map-input encoder, round-trip property suite, error-path coverage."

[bundles.typespecs_docs]
phase = 3
order = 3
description = "Typespec/doc gap closure, README refresh, padding-helper extraction, Credo strict cleanup, predicate rename, address-payable note."

[bundles.hardening]
phase = 3
order = 4
description = "Security hardening of opt-in decode paths — atom-creation bound on decode_structs: true."

[bundles.discovery]
phase = 3
order = 5
description = "Discovery / research exercises that surface candidate tasks — defi-skills action-surface mining."

[bundles.defi_fixtures]
phase = 4
order = 1
description = "DeFi Real-World Fixtures — golden calldata vectors and function-selector golden vectors captured from defi-skills build across 13 protocols."

[bundles.property_suite]
phase = 4
order = 2
description = "Property Suite Expansion — tuple[] round-trips, empty bytes/tuple[] in struct fields, multiple top-level struct args, deep struct nesting."

[bundles.encode_symmetry]
phase = 5
order = 1
description = "Encode-Side Symmetry Pass — encode_call/3, encode_error/3, encode_event_topics/2: the encode-side counterparts to the already-shipped decode_call/3, decode_error/2, decode_event/4. Ships as one minor bump."

[bundles.peer_parity]
phase = 5
order = 2
description = "Peer-library parity items beyond the encode-side symmetry trio — decode_call/method_id, function type, get_abi_item lookup helper, strict-decode mode, deferred fixed/ufixed."

# ---------------------------------------------------------------------------
# Milestones
# ---------------------------------------------------------------------------

[milestones.encode_symmetry]
name = "Encode-Side Symmetry"
order = 1
status = "active"
target_version = "1.5.0"
description = "Proves consumers building transactions need the encode-side counterparts (encode_call / encode_error / encode_event_topics) to match the decode APIs already shipped, rather than hand-assembling selector-prefixed calldata."

