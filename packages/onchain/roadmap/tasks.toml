scores = { d = 4, b = 7, u = 6 }
acceptance_criteria = ["eth_config/1 and eth_capabilities/1 are exposed on Onchain.RPC following the module's existing conventions, returning cartouche's Configuration and Capabilities structs rather than onchain-local re-decodings", "Both are verified against the live archive node with a test that asserts domain meaning — a specific known chain id and fork identifier from eth_config, and a concrete retention boundary from eth_capabilities — not merely that a struct came back", "Both are also exercised against a second, non-archive endpoint, and the real observed response is pinned: a genuine capabilities report if the node serves one, or its actual refusal if it does not. A node that does not implement the method is recorded as such rather than skipped", "A documented, tested example shows a caller reading the retention window from eth_capabilities and deciding whether a historical query is servable before issuing it — this is the consumer-facing point of the task and a test asserts the decision is correct for both a servable and an unservable block", "The README and the module's moduledoc table cover both methods and the pre-flight retention check", "Tests requiring an endpoint flunk with the exact env vars and setup instructions when it is unset, never skip silently", "mix ci passes"]
out_of_scope = ["base_fee/1 and blob_base_fee/1 \u2014 delivered inline 2026-08-25, before this task. base_fee/1 deliberately does not wrap Erigon's eth_baseFee (Alchemy rejects it -32600); it reads baseFeePerGas from the pending block header instead. That decision is evidence FOR this task, not a substitute: it was made by hand-probing two endpoints, which is exactly the pre-flight check eth_capabilities/eth_config should make programmatic", "Automatically routing, retrying or degrading based on what the node reports — this task exposes the facts, it does not act on them", "Caching the capability report across calls", "Cartouche.Filter and the filter-lifecycle methods — task 90 owns those"]
files_to_modify = ["lib/onchain/rpc.ex"]
touches = ["lib/onchain/rpc.ex", "test/onchain/rpc_test.exs", "README.md"]
assignee = "codex"
model = "gpt-5.6-sol"
body = """
cartouche 0.8.0 added `Cartouche.RPC.eth_config/1` and `Cartouche.RPC.eth_capabilities/1`, both already deserializing into structs (`Cartouche.RPC.Configuration`, `Cartouche.RPC.Capabilities`) and both ignoring unknown fields so a newer node revision does not break the decoder. Neither is exposed through `Onchain.RPC`. Expose them, and treat the consumer's node — not ours — as the case that matters.

`eth_config` is EIP-7910: the node's current, next and last fork configuration, with `activationTime`, `chainId`, `forkId`, and the named precompile and system-contract addresses. `eth_capabilities` reports the node's effective historical-data retention — its head, `oldestBlock`, and `deleteStrategy` per resource. Together they answer the two questions a consumer of this library cannot currently ask before making a call: which fork rules is this node on, and how far back can it actually serve.

That second question is the load-bearing one here. This repo's own integration suites depend on an archive node and CLAUDE.md records what happens without one — a hosted endpoint answering `-32001 Unable to complete request` for a historical-block `eth_feeHistory` at block 20,000,000, depending on plan and load. A consumer hitting that has no way to distinguish "this node cannot serve block 20,000,000" from "this call is wrong". `eth_capabilities` is the method that makes it answerable in advance, so the wrappers must come with a documented way to use them for exactly that: read the retention window, compare it against the block you are about to query, and decide before you spend the round trip.

Follow the module's existing conventions — the codegen/specs path where the method is in the vendored spec, the `api/3` declarations, and the bang variants its neighbours have. Return cartouche's structs rather than re-deserializing into onchain-local shapes; the substrate already owns that decoding and duplicating it would give the family two representations to keep in sync.

Both methods are recent and support is uneven, which is the situation this task exists to make legible: verify against more than one endpoint and pin what each actually does, including a node that does not implement them at all.
"""
created_at = "2026-08-25"
scored_at = "2026-08-25"
depends_on = [91]

