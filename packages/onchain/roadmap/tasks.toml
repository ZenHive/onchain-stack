acceptance_criteria = ["create_access_list is exposed on Onchain.RPC following the module's existing conventions, including the api/3 declaration and bang variant its neighbours have", "A live call against the archive node returns an access list for a call that touches known storage, and a test asserts the specific addresses and storage keys returned — not merely that a non-empty list came back", "The returned list is passed unmodified into Onchain.Signer.build_transaction/3 as :access_list in a test, producing a valid signed transaction — proving the shapes line up without caller-side reshaping", "The gas saving is demonstrated rather than asserted: a test compares eth_estimateGas for the same call with and without the access list and records both numbers", "The case where the node returns both an access list and an execution error is pinned against a live reverting call, and the documented return shape for it is asserted", "What a second, non-archive endpoint does with the method is recorded — a real result or its real refusal, never a skip", "The moduledoc documents the method, the partial-failure shape, and the build_transaction handoff", "mix ci passes"]
out_of_scope = ["eth_getBlockAccessList — the EIP-7928 block-level read, owned by task 85; do not conflate the two methods", "Automatically computing an access list inside build_transaction or send_transaction — the caller decides whether the extra round trip is worth it", "Adding EIP-2930 type-1 transaction support; the access list here rides on the existing EIP-1559 V2 transaction"]
files_to_modify = ["lib/onchain/rpc.ex"]
