[package]
name = "onchain_tempo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
tempo-primitives = { version = "=1.11.0", default-features = false, features = ["std", "serde"] }
alloy-consensus = { version = "=2.3.0", default-features = false }
alloy-primitives = { version = "=1.6.1", features = ["serde"] }
alloy-rlp = "0.3.16"
serde_json = "1"
