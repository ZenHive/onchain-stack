# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# Versions are sourced from `.tool-versions` (asdf format) at the repo root via
# `setup-beam` — guarantees CI and local dev never drift on `mix format` output.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Cache deps + the dialyxir PLT only. `_build` is deliberately NOT cached:
      # it holds the Rustler NIF artifacts (priv/native/*.so) and a per-crate
      # compile manifest. A restored `_build` makes Rustler treat an unchanged
      # crate as already-built and skip it — but `priv/native/` is not cached, so
      # the skipped crate's .so never gets regenerated and module load crashes
      # (e.g. Doctor's module_info/0 on Onchain.Solidity). Forcing a clean `_build`
      # each run makes Rustler rebuild + copy every NIF. Cargo's own target/ was
      # never cached, so this adds no native-compile cost.
      - name: Cache deps & dialyxir PLT
        uses: actions/cache@v6
        with:
          path: |
            deps
            priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      # Cache the Cargo registry/git index and each crate's target/ so the revm +
      # alloy + solang-parser dependency tree isn't recompiled from scratch every
      # run. Keyed on the Cargo.lock files: a dependency bump invalidates the
      # cache, an unchanged tree restores it. This is orthogonal to the `_build`
      # decision above — `_build` stays uncached so Rustler always re-runs the
      # build step and re-copies priv/native/*.so; a warm target/ just makes that
      # cargo build incremental instead of cold.
      - name: Cache Cargo registry & crate targets
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/onchain_evm/target
            native/onchain_solidity/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: mix deps.get

      # Single deterministic gate: compile / format / credo / doctor / ex_dna /
      # reach.check (arch+smells) / sobelow --skip / deps.audit.gated /
      # test.json (coverage >=85%) / dialyzer / agents.check (AGENTS.md
      # freshness). Kept as one `mix ci` invocation so CI and the local /
      # harness-reviewer gate cannot drift apart — see mix.exs `aliases/0`.
      - name: mix ci
        run: mix ci
