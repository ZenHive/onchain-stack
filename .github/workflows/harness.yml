# Deterministic Elixir harness gate for PRs.
# Mirrors the local `mix ci` (= `mix precommit.full`) alias so every PR push
# gets format / compile / credo / doctor / ex_dna / reach (arch+smell) /
# sobelow / deps.audit / test+cover / dialyzer / AGENTS.md-freshness evidence
# as PR checks, instead of needing a local reviewer to fetch the branch and
# run the suite. CI and local dev share one gate definition (mix.exs
# `aliases/0`).
#
# Versions sourced from `.tool-versions` (asdf format) at the repo root via
# `setup-beam` — guarantees CI and local dev never drift on `mix format` output.
# Local dev may run a newer RC; CI pins the stable line declared in `.tool-versions`.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.

name: Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # mix.exs `aliases/0` `ci: ["precommit.full"]` — see mix.exs for the
      # step list (compile, format, credo, doctor, ex_dna, reach.check,
      # sobelow, deps.audit.gated, test+cover, dialyzer, agents.check).
      # Coverage floor is 25 against a 27.78% measured baseline (2026-08-01) —
      # this repo's lib/ surface is a thin 4-module bridge; most behavior is
      # only exercised by the (excluded-by-default) QuickBEAM integration
      # tests. This replaces a stale 85% threshold the hand-maintained step
      # list below previously asserted without actually meeting it.
      - name: mix ci
        run: mix ci
