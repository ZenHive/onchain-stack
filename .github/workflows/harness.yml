# Deterministic Elixir harness gate for PRs.
# Mirrors the local `mix ci` (= `mix precommit.full`) alias so every PR push
# gets format / compile / credo / doctor / reach (arch+smell) / sobelow /
# deps.audit / test+cover / dialyzer / AGENTS.md-freshness evidence as PR
# checks, instead of needing a local reviewer to fetch the branch and run the
# suite. CI and local dev share one gate definition (mix.exs `aliases/0`).
#
# Elixir/OTP are pinned inline (this repo has no `.tool-versions`). Adopting a
# `.tool-versions` and switching to `version-file` would make CI and local dev
# share one source and is the recommended follow-up.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: onchain_aave
    steps:
      - uses: actions/checkout@v7
        with:
          path: onchain_aave

      # onchain_aave/mix.exs declares a sibling path dependency,
      # {:onchain_evm, path: "../onchain_evm", only: [:dev, :test]}, so the
      # runner needs an actual ../onchain_evm checkout next to this repo or
      # `mix deps.get`/`mix compile` fails with "Unchecked dependencies". Do
      # not remove this checkout. Tracks onchain_evm's default branch
      # (development), matching the branch this workflow builds against.
      - uses: actions/checkout@v7
        with:
          repository: ZenHive/onchain_evm
          ref: development
          path: onchain_evm

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v6
        with:
          path: |
            onchain_aave/deps
            onchain_aave/_build
            onchain_aave/priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('onchain_aave/**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # mix.exs `aliases/0` `ci: ["precommit.full"]` — see mix.exs for the
      # step list (compile, format, credo, doctor, reach.check, sobelow,
      # deps.audit.gated, test+cover, dialyzer, agents.check).
      - name: mix ci
        run: mix ci
