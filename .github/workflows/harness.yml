# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# Versions sourced from `.tool-versions` (asdf format) at the repo root via
# `setup-beam` — guarantees CI and local dev never drift on `mix format` output.
# Local dev may run a newer RC; CI pins the stable line declared in `.tool-versions`.
#
# No untrusted-input interpolation — only matrix, runner, beam outputs, hashFiles.

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read
  actions: write

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps & _build (covers dialyxir PLT default path)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # Exclude TagTODO/TagFIXME in CI so the harness fails only on actionable
      # Credo regressions. TODO/FIXME markers remain visible in code review, but
      # accumulated tracked-debt tags across sessions should not gate PRs.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      # Run Doctor with `--raise` in CI so documentation issues fail the harness.
      - name: Doctor (CI gate with --raise)
        run: mix doctor --raise

      - name: Sobelow (honors .sobelow-conf, exit=Low)
        run: mix sobelow --exit Low

      # Coverage tiers (per ~/.claude/includes/critical-rules.md § "RAISE
      # COVERAGE BEFORE MUTATING"):
      #   80% — standard business logic
      #   85% — project default (meaningful bump from 80%, leaves headroom)
      #   95% — critical paths (signing, money, crypto, wire-format encoders)
      # `--exclude integration` because CI lacks credentials/network for
      # QuickBEAM runtime / live services.
      - name: Tests + coverage gate (>=85%)
        run: mix test.json --cover --cover-threshold 85 --summary-only --exclude integration

      # Dialyzer-in-CI: KEEP. mix.exs already pins `plt_add_deps: :apps_direct`
      # to avoid OOM on tidewave/bandit's transitive HTTP stack.
      - name: Dialyzer
        run: mix dialyzer
