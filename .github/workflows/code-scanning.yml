# Elixir-native code scanning: Sobelow -> SARIF -> GitHub code scanning.
#
# CodeQL's "security-and-quality" suite does not support Elixir, so we surface
# Sobelow findings in the same Security tab "Code scanning alerts" view by
# uploading SARIF. This REPORTS (always uploads, even with findings); enforce a
# hard `mix sobelow` gate in the repo's CI if you want it to block.

name: Code Scanning

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Weekly resweep so new Sobelow rules / advisories surface without a push.
    - cron: "27 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: code-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sobelow-sarif:
    name: Sobelow SARIF
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    defaults:
      run:
        working-directory: onchain_aave
    steps:
      - uses: actions/checkout@v7
        with:
          path: onchain_aave

      # onchain_aave/mix.exs declares a sibling path dependency,
      # {:onchain_evm, path: "../onchain_evm", only: [:dev, :test]}, so the
      # runner needs an actual ../onchain_evm checkout next to this repo or
      # `mix deps.get`/`mix compile` fails with "Unchecked dependencies". Do
      # not remove this checkout. Tracks onchain_evm's default branch
      # (development), matching the branch this workflow builds against.
      - uses: actions/checkout@v7
        with:
          repository: ZenHive/onchain_evm
          ref: development
          path: onchain_evm

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps & _build
        uses: actions/cache@v6
        with:
          path: |
            onchain_aave/deps
            onchain_aave/_build
          key: scan-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('onchain_aave/**/mix.lock') }}
          restore-keys: |
            scan-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Compile separately so build output never pollutes the SARIF stdout below.
      - name: Compile
        run: mix compile

      # `--format sarif` emits structured JSON to stdout (no human banner); the
      # preceding `mix compile` keeps that stdout clean. continue-on-error so a
      # non-zero exit still lets us upload the report.
      - name: Run Sobelow (SARIF)
        continue-on-error: true
        run: mix sobelow --format sarif > sobelow.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: onchain_aave/sobelow.sarif
          category: sobelow
